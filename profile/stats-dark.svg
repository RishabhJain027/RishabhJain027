<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none" role="img">
  <title>RishabhJain027 GitHub Stats</title>
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #22D3EE; }
    .stat { font: 600 14px 'Segoe UI', Ubuntu, Sans-Serif; fill: #CBD5E1; }
    .bold { font-weight: 700; }
    .icon { fill: #A78BFA; }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" height="99%" stroke="#000000" stroke-opacity="0" width="494" fill="#050816"/>
  <g transform="translate(25, 35)">
    <g transform="translate(0, 0)">
      <text x="0" y="0" class="header">Rishabh Jain's GitHub Stats</text>
    </g>
    <g transform="translate(0, 30)">
      <g transform="translate(0, 0)">
        <text class="stat bold" x="0" y="12.5">Total Stars Earned:</text>
        <text class="stat" x="200" y="12.5">--</text>
      </g>
      <g transform="translate(0, 25)">
        <text class="stat bold" x="0" y="12.5">Total Commits:</text>
        <text class="stat" x="200" y="12.5">--</text>
      </g>
      <g transform="translate(0, 50)">
        <text class="stat bold" x="0" y="12.5">Total PRs:</text>
        <text class="stat" x="200" y="12.5">--</text>
      </g>
      <g transform="translate(0, 75)">
        <text class="stat bold" x="0" y="12.5">Total Issues:</text>
        <text class="stat" x="200" y="12.5">--</text>
      </g>
      <g transform="translate(0, 100)">
        <text class="stat bold" x="0" y="12.5">Contributed to:</text>
        <text class="stat" x="200" y="12.5">--</text>
      </g>
    </g>
  </g>
</svg>