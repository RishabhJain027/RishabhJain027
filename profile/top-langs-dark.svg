<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" fill="none" role="img">
  <title>Most Used Languages</title>
  <style>
    .header { font: 600 18px 'Segoe UI', Ubuntu, Sans-Serif; fill: #22D3EE; }
    .lang-name { font: 400 12px 'Segoe UI', Ubuntu, Sans-Serif; fill: #CBD5E1; }
  </style>
  <rect x="0.5" y="0.5" rx="4.5" height="99%" stroke="#000000" stroke-opacity="0" width="494" fill="#050816"/>
  <g transform="translate(25, 35)">
    <text x="0" y="0" class="header">Most Used Languages</text>
    <g transform="translate(0, 30)">
      <text x="0" y="15" class="lang-name">C++ • JavaScript • Python • HTML • CSS • TypeScript</text>
    </g>
  </g>
</svg>